<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach de Inglês da Denize</title>
<meta name="theme-color" content="#8b5cf6">
<meta name="description" content="Aula diária de inglês de 20 minutos para o seu trajeto até o trabalho.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">

<div id="app" class="app">

  <!-- TELA INICIAL: escolher ambiente -->
  <section id="screen-home" class="screen">
    <header class="topbar">
      <span class="brand">Coach de Inglês</span>
      <span class="streak" id="streak-badge">🔥 0</span>
    </header>

    <p class="teacher-line" id="home-greeting">Oi, Denize!</p>
    <p class="day-sub" id="home-sub">Escolha um ambiente para praticar hoje</p>

    <div class="ambiente-grid" id="ambiente-grid"></div>

    <button id="btn-review" class="btn-secondary">Rever cenas concluídas</button>
    <p class="hint" id="stt-hint"></p>
  </section>

  <!-- TELA DE REVISÃO -->
  <section id="screen-review" class="screen hidden">
    <header class="topbar">
      <button id="btn-review-back" class="btn-icon" aria-label="Voltar">←</button>
      <span class="phase-label">Rever cenas</span>
      <span style="width:44px"></span>
    </header>
    <div class="review-list" id="review-list"></div>
  </section>

  <!-- TELA DE PERSONAGENS -->
  <section id="screen-characters" class="screen hidden">
    <header class="topbar">
      <button id="btn-characters-back" class="btn-icon" aria-label="Voltar">←</button>
      <span class="phase-label" id="characters-title">Personagens</span>
      <span style="width:44px"></span>
    </header>

    <p class="day-sub" id="characters-sub">Quem vai participar dessa cena?</p>
    <div class="character-list" id="character-list"></div>

    <button id="btn-start-scene" class="btn-primary">Começar</button>
  </section>

  <!-- TELA DE CUSTOMIZAÇÃO DE PERSONAGEM -->
  <section id="screen-customize" class="screen hidden">
    <header class="topbar">
      <button id="btn-customize-back" class="btn-icon" aria-label="Voltar">←</button>
      <span class="phase-label">Personagem</span>
      <span style="width:44px"></span>
    </header>

    <div id="role-step">
      <p class="day-sub">Escolha o papel</p>
      <div class="role-list" id="role-list"></div>
    </div>

    <div id="name-step" class="hidden">
      <p class="day-sub" id="name-step-label">Qual o nome?</p>
      <input type="text" id="character-name-input" class="text-input" placeholder="Nome" maxlength="24">
      <button id="btn-save-character" class="btn-primary">Salvar</button>
      <button id="btn-remove-character" class="btn-secondary hidden">Remover personagem</button>
    </div>
  </section>

  <!-- TELA DE TREINO / DIÁLOGO -->
  <section id="screen-lesson" class="screen hidden">
    <header class="topbar">
      <button id="btn-exit" class="btn-icon" aria-label="Sair">✕</button>
      <span class="phase-label" id="phase-label">Treino</span>
      <button id="btn-pause" class="btn-icon" aria-label="Pausar">⏸</button>
    </header>

    <div class="progress-dots" id="progress-dots"></div>

    <div class="lesson-content">
      <p class="caption-pt" id="caption-pt"></p>
      <p class="caption-en" id="caption-en"></p>
      <div class="mic-indicator hidden" id="mic-indicator">🎙️ Sua vez de falar...</div>
      <p class="feedback" id="feedback"></p>
    </div>

    <div class="lesson-controls">
      <button id="btn-repeat" class="btn-secondary">Repetir</button>
      <button id="btn-skip" class="btn-secondary">Pular</button>
    </div>
  </section>

  <!-- TELA DE CONCLUSÃO -->
  <section id="screen-done" class="screen hidden">
    <div class="done-content">
      <p class="done-emoji">🎉</p>
      <h1 id="done-title">Cena concluída!</h1>
      <p class="streak-big" id="done-streak">Sequência: 1 dia</p>
      <p class="done-recap" id="done-recap"></p>
      <button id="btn-back-home" class="btn-primary">Voltar</button>
    </div>
  </section>

</div>

<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
